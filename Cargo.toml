[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["tests/corpora", "references/VBA-Docs", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/matt123p/tiny-vba"

[workspace.dependencies]
vba-diagnostics = { path = "crates/vba-diagnostics" }
vba-values = { path = "crates/vba-values" }
vba-syntax = { path = "crates/vba-syntax" }
vba-semantics = { path = "crates/vba-semantics" }
vba-compiler = { path = "crates/vba-compiler" }
vba-ir = { path = "crates/vba-ir" }
vba-runtime = { path = "crates/vba-runtime" }
vba-foreign = { path = "crates/vba-foreign" }
vba-vm = { path = "crates/vba-vm" }
vba-debug = { path = "crates/vba-debug" }
vba-dap = { path = "crates/vba-dap" }
vba-project = { path = "crates/vba-project" }
vba-testkit = { path = "crates/vba-testkit" }
vba-conformance = { path = "crates/vba-conformance" }
vba-ide = { path = "crates/vba-ide" }
vba-ui-egui = { path = "crates/vba-ui-egui" }
serde_json = "=1.0.154"
egui = { version = "=0.37.0", features = ["default_fonts"] }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "clipboard", "persistence"] }
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
web-sys = { version = "=0.3.103", features = ["Document", "Window", "HtmlCanvasElement", "Element"] }
js-sys = "=0.3.103"

# Same egui API family and reviewed fork as the embedding applications (ADR 0016).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }

winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
